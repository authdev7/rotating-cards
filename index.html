<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating Cards</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main id="rotating-cards">
        <div class="card one">
            <div class="left">
                <span>A</span>
                <span>♠</span>
            </div>
            <div class="middle">♠</div>
            <div class="right">
                <span>A</span>
                <span>♠</span>
            </div>
        </div>


        <div class="card two">
            <div class="left">
                <span>2</span>
                <span>♣</span>
            </div>
            <div class="middle">
                <span class="up">♣</span>
                <span class="down">♣</span>
            </div>
            <div class="right">
                <span>2</span>
                <span>♣</span>
            </div>
        </div>


        <div class="card three red">
            <div class="left">
                <span>3</span>
                <span>♥</span>
            </div>
            <div class="middle">
                <span class="up">♥</span>
                <span class="up">♥</span>
                <span class="down">♥</span>
            </div>
            <div class="right">
                <span>3</span>
                <span>♥</span>
            </div>
        </div>


        <div class="card four">
            <div class="left">
                <span>4</span>
                <span>♣</span>
            </div>
            <div class="middle">
                <span class="up">♣♣</span>
                <span class="down">♣♣</span>
            </div>
            <div class="right">
                <span>4</span>
                <span>♣</span>
            </div>
        </div>


        <div class="card five red">
            <div class="left">
                <span>5</span>
                <span>♦</span>
            </div>
            <div class="middle">
                <span class="up">♦♦</span>
                <span class="up">♦</span>
                <span class="down">♦♦</span>
            </div>
            <div class="right">
                <span>5</span>
                <span>♦</span>
            </div>
        </div>


        <div class="card six">
            <div class="left">
                <span>6</span>
                <span>♣</span>
            </div>
            <div class="middle">
                <span class="up">♣♣</span>
                <span class="up">♣♣</span>
                <span class="down">♣♣</span>
            </div>
            <div class="right">
                <span>6</span>
                <span>♣</span>
            </div>
        </div>



    </main>
</body>

</html>
